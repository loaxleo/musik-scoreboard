<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik-Scoreboard | PHSG</title>
    <!-- Moderne, saubere Schriftart (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* PHSG Corporate Design Farben (Light Mode) */
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --border-color: #E2E8F0;
            --phsg-green: #10B981; /* Frisches PHSG-Akzentgrün */
            --phsg-dark-green: #064E3B;
            --podium-1: #D97706; /* Gold */
            --podium-2: #64748B; /* Silber */
            --podium-3: #B45309; /* Bronze */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        /* Automatischer Dark Mode (oder erzwungen via System) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0F172A;
                --card-bg: #1E293B;
                --text-main: #F8FAFC;
                --text-muted: #94A3B8;
                --border-color: #334155;
                --phsg-green: #34D399;
                --phsg-dark-green: #065F46;
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .last-update {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Podium Sektion */
        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
            align-items: end;
        }

        .podium-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        .podium-card.rank-1 {
            order: 2;
            transform: translateY(-10px);
            border-color: var(--phsg-green);
        }

        .podium-card.rank-2 {
            order: 1;
        }

        .podium-card.rank-3 {
            order: 3;
        }

        .rank-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            background: var(--border-color);
            color: var(--text-main);
        }

        .rank-1 .rank-badge {
            background-color: var(--phsg-green);
            color: #FFFFFF;
        }

        .podium-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .podium-score {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--phsg-green);
        }

        .podium-units {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Rangliste Tabelle */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background-color: var(--bg-color);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .col-rank {
            width: 10%;
            font-weight: 600;
            color: var(--text-muted);
        }

        .col-name {
            width: 50%;
            font-weight: 500;
        }

        .col-minutes, .col-units {
            width: 20%;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .col-minutes {
            font-weight: 600;
            color: var(--phsg-green);
        }

        @media (max-width: 640px) {
            .podium {
                grid-template-columns: 1fr;
            }
            .podium-card.rank-1 {
                transform: none;
                order: 1;
            }
            .podium-card.rank-2 { order: 2; }
            .podium-card.rank-3 { order: 3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Musik-Scoreboard LG26</h1>
            <div class="last-update" id="update-time">Lade Daten...</div>
        </header>

        <!-- Dynamisches Podium für Platz 1-3 -->
        <div class="podium" id="podium-container">
            <!-- Wird per JavaScript befüllt -->
        </div>

        <!-- Vollständige Rangliste -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-rank">Rang</th>
                        <th class="col-name">Name</th>
                        <th class="col-minutes">Minuten</th>
                        <th class="col-units">Einheiten</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body">
                    <!-- Wird per JavaScript befüllt -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Daten konnten nicht geladen werden.');
                
                const data = await response.json();
                document.getElementById('update-time').innerText = `Stand: ${data.updated_at}`;

                // Sortieren nach Minuten (absteigend)
                const entries = data.entries.sort((a, b) => b.minuten - a.minuten);

                renderPodium(entries.slice(0, 3));
                renderTable(entries);

            } catch (error) {
                console.error(error);
                document.getElementById('update-time').innerText = 'Fehler beim Laden der Daten.';
            }
        }

        function renderPodium(top3) {
            const container = document.getElementById('podium-container');
            container.innerHTML = '';

            // Reihenfolge für optisches Podest: 2. Platz, 1. Platz, 3. Platz
            const order = [1, 0, 2];
            
            order.forEach(index => {
                if (!top3[index]) return;
                const entry = top3[index];
                const rank = index + 1;

                const card = document.createElement('div');
                card.className = `podium-card rank-${rank}`;
                card.innerHTML = `
                    <div class="rank-badge">${rank}. Platz</div>
                    <div class="podium-name" title="${entry.name}">${entry.name}</div>
                    <div class="podium-score">${entry.minuten} <span style="font-size: 0.8rem; font-weight: 400; color: var(--text-muted);">min</span></div>
                    <div class="podium-units">${entry.einheiten} Einheiten</div>
                `;
                container.appendChild(card);
            });
        }

        function renderTable(entries) {
            const tbody = document.getElementById('scoreboard-body');
            tbody.innerHTML = '';

            entries.forEach((entry, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-rank">${index + 1}</td>
                    <td class="col-name">${entry.name}</td>
                    <td class="col-minutes">${entry.minuten} min</td>
                    <td class="col-units">${entry.einheiten}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initial laden & alle 30 Sekunden aktualisieren
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
