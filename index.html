<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik-Scoreboard | PHSG</title>
    <!-- Inter Schriftart -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* PHSG Clean Look: Reines Weiß & Schwarz mit echten Grüntönen (Light Mode) */
            --bg-color: #FFFFFF;
            --card-bg: #FAFAFA;
            --text-main: #111111;
            --text-muted: #666666;
            --border-color: #E0E0E0;
            --green-accent: #059669;  /* Frisches, kräftiges Grün */
            --green-dark: #022C22;    /* Satte, dunkle PHSG-Grünbasis */
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
        }

        /* Automatischer Dark Mode: Echtes Schwarz (#000000) & Dunkelgrün */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #121212;
                --text-main: #F3F4F6;
                --text-muted: #9CA3AF;
                --border-color: #262626;
                --green-accent: #34D399;  /* Leuchtendes Akzentgrün für Dark Mode */
                --green-dark: #064E3B;    /* Tiefes Dunkelgrün */
                --shadow: 0 4px 6px -1px rgba(255, 255, 255, 0.03);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .last-update {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Podium */
        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
            align-items: end;
        }

        .podium-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: var(--shadow);
            position: relative;
        }

        .podium-card.rank-1 {
            order: 2;
            transform: translateY(-10px);
            border-color: var(--green-accent);
            background: linear-gradient(to bottom, var(--card-bg), var(--green-dark));
        }

        .podium-card.rank-2 { order: 1; }
        .podium-card.rank-3 { order: 3; }

        .rank-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            background: var(--border-color);
            color: var(--text-main);
        }

        .rank-1 .rank-badge {
            background-color: var(--green-accent);
            color: #000000;
        }

        .podium-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .podium-score {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--green-accent);
        }

        .podium-units {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Tabelle */
        .table-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }

        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            background-color: var(--card-bg);
        }

        tr:last-child td {
            border-bottom: none;
        }

        .col-rank { width: 10%; font-weight: 600; color: var(--text-muted); }
        .col-name { width: 50%; font-weight: 500; }
        .col-minutes, .col-units { width: 20%; text-align: right; font-variant-numeric: tabular-nums; }
        
        .col-minutes {
            font-weight: 600;
            color: var(--green-accent);
        }

        @media (max-width: 640px) {
            .podium { grid-template-columns: 1fr; }
            .podium-card.rank-1 { transform: none; order: 1; }
            .podium-card.rank-2 { order: 2; }
            .podium-card.rank-3 { order: 3; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Musik-Scoreboard LG26</h1>
            <div class="last-update" id="update-time">Lade Daten...</div>
        </header>

        <div class="podium" id="podium-container"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-rank">Rang</th>
                        <th class="col-name">Name</th>
                        <th class="col-minutes">Minuten</th>
                        <th class="col-units">Einheiten</th>
                    </tr>
                </thead>
                <tbody id="scoreboard-body"></tbody>
            </table>
        </div>
    </div>
