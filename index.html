<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musik-Scoreboard LG26 | PHSG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@300;400;500;600&family=Platypi:wght@300;400&display=swap" rel="stylesheet">
    <style>
        /* Farben & Schriften nach phsg.ch (Stand Nov. 2026) */
        :root {
            --green: #009B56;        /* PHSG-Grün */
            --green-dark: #1C3E37;   /* Footer-Grün */
            --petrol: #005D75;
            --ochre: #967231;
            --text: #666666;
            --text-strong: #1A1A1A;
            --line: rgba(0, 0, 0, 0.1);
            --bg-soft: #EFEFEF;
            --white: #FFFFFF;
            --serif: 'Platypi', Georgia, serif;
            --sans: 'Albert Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
            --max: 880px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.5;
            color: var(--text);
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 1.25rem; }

        /* Kopfzeile */
        .topbar { border-bottom: 1px solid var(--line); }
        .topbar .wrap {
            display: flex; justify-content: space-between; align-items: center;
            height: 64px;
        }
        .brand { font-weight: 600; color: var(--green); letter-spacing: 0.02em; font-size: 0.95rem; }
        .brand span { color: var(--text); font-weight: 400; }
        .live { font-size: 0.8rem; color: var(--text); display: flex; align-items: center; gap: 0.5rem; }
        .live::before { content: ''; width: 8px; height: 8px; background: var(--green); display: inline-block; }

        /* Titelfläche */
        .hero { background: var(--green); color: var(--white); }
        .hero .wrap { padding-top: 3rem; padding-bottom: 2.75rem; }
        .eyebrow { font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; margin-bottom: 0.75rem; }
        h1 { font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 5vw, 2.9rem); line-height: 1.15; }
        .updated { margin-top: 1rem; font-size: 0.9rem; opacity: 0.9; }

        /* Kennzahlen */
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
        .stat { padding: 1.5rem 1.25rem; border-right: 1px solid var(--line); }
        .stat:last-child { border-right: none; }
        .stat-value { font-family: var(--serif); font-weight: 300; font-size: 2rem; color: var(--text-strong); line-height: 1.1; font-variant-numeric: tabular-nums; }
        .stat-label { font-size: 0.85rem; margin-top: 0.25rem; }

        main { flex: 1; }
        section { padding: 3rem 0 0; }
        h2 { font-family: var(--serif); font-weight: 300; font-size: 1.6rem; color: var(--text); margin-bottom: 1.25rem; }

        /* Podium: flache Farbflächen, keine Verläufe, keine Rundungen */
        .podium { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .podium-card { color: var(--white); padding: 1.5rem 1.25rem 1.25rem; min-height: 190px; display: flex; flex-direction: column; justify-content: space-between; }
        .podium-card.r1 { background: var(--green-dark); }
        .podium-card.r2 { background: var(--petrol); }
        .podium-card.r3 { background: var(--ochre); }
        .podium-rank { font-family: var(--serif); font-weight: 300; font-size: 3rem; line-height: 1; }
        .podium-name { font-weight: 500; font-size: 1.1rem; margin-top: 1.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .podium-meta { font-size: 0.9rem; opacity: 0.85; }

        /* Rangliste */
        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th {
            text-align: left; font-weight: 500; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;
            padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--text);
        }
        td { padding: 0.95rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
        .c-rank { width: 3.5rem; font-variant-numeric: tabular-nums; }
        .c-name { color: var(--text-strong); font-weight: 500; }
        .c-min { width: 40%; }
        .c-units { width: 6.5rem; text-align: right; font-variant-numeric: tabular-nums; }
        th.c-units { text-align: right; }
        .bar-row { display: flex; align-items: center; gap: 0.75rem; }
        .bar { flex: 1; height: 6px; background: var(--bg-soft); }
        .bar > i { display: block; height: 100%; background: var(--green); }
        .bar-num { width: 4.5rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-strong); }
        tr.top .c-rank { color: var(--green); font-weight: 600; }

        .error { padding: 1rem; background: var(--bg-soft); }

        footer { background: var(--green-dark); color: var(--white); margin-top: 4rem; }
        footer .wrap { padding-top: 1.75rem; padding-bottom: 1.75rem; font-size: 0.85rem; font-weight: 300; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

        @media (max-width: 640px) {
            .stats { grid-template-columns: 1fr 1fr 1fr; }
            .stat { padding: 1.1rem 0.75rem; }
            .stat-value { font-size: 1.5rem; }
            .podium { grid-template-columns: 1fr; }
            .podium-card { min-height: 0; flex-direction: row; align-items: center; gap: 1rem; justify-content: flex-start; padding: 1rem 1.25rem; }
            .podium-rank { font-size: 2rem; width: 2rem; }
            .podium-name { margin-top: 0; }
            .c-min { width: auto; }
            .bar { display: none; }
            .bar-num { width: auto; }
            .c-units { width: 4.5rem; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="wrap">
            <div class="brand">PHSG <span>· Singen &amp; Begleiten üben</span></div>
            <div class="live">Live</div>
        </div>
    </header>

    <div class="hero">
        <div class="wrap">
            <div class="eyebrow">High Score</div>
            <h1>Musik-Scoreboard LG26</h1>
            <div class="updated" id="update-time">Lade Daten …</div>
        </div>
    </div>

    <div class="wrap">
        <div class="stats">
            <div class="stat"><div class="stat-value" id="s-min">–</div><div class="stat-label">Minuten total</div></div>
            <div class="stat"><div class="stat-value" id="s-units">–</div><div class="stat-label">Einheiten total</div></div>
            <div class="stat"><div class="stat-value" id="s-people">–</div><div class="stat-label">Teilnehmende</div></div>
        </div>
    </div>

    <main class="wrap">
        <section>
            <h2>Podest</h2>
            <div class="podium" id="podium"></div>
        </section>
        <section>
            <h2>Rangliste</h2>
            <table>
                <thead>
                    <tr>
                        <th class="c-rank">Rang</th>
                        <th>Name</th>
                        <th class="c-min">Minuten</th>
                        <th class="c-units">Einheiten</th>
                    </tr>
                </thead>
                <tbody id="board"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <span>Pädagogische Hochschule St.Gallen</span>
            <span>Aktualisiert sich automatisch alle 30 Sekunden</span>
        </div>
    </footer>

    <script>
        const el = (tag, cls, text) => {
            const n = document.createElement(tag);
            if (cls) n.className = cls;
            if (text !== undefined) n.textContent = text;
            return n;
        };

        // Gleiche Minuten = gleicher Rang (1, 2, 2, 4 …)
        function withRanks(entries) {
            let rank = 0;
            return entries.map((e, i) => {
                if (i === 0 || e.minuten !== entries[i - 1].minuten) rank = i + 1;
                return { ...e, rang: rank };
            });
        }

        async function loadData() {
            try {
                const res = await fetch('data.json?t=' + Date.now());
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                const entries = withRanks([...data.entries].sort((a, b) => b.minuten - a.minuten || b.einheiten - a.einheiten));

                document.getElementById('update-time').textContent = 'Stand: ' + data.updated_at;
                document.getElementById('s-min').textContent = entries.reduce((s, e) => s + e.minuten, 0);
                document.getElementById('s-units').textContent = entries.reduce((s, e) => s + e.einheiten, 0);
                document.getElementById('s-people').textContent = entries.length;

                renderPodium(entries.slice(0, 3));
                renderTable(entries);
            } catch (err) {
                console.error(err);
                document.getElementById('update-time').textContent = 'Daten konnten nicht geladen werden';
            }
        }

        function renderPodium(top3) {
            const box = document.getElementById('podium');
            box.innerHTML = '';
            top3.forEach((e, i) => {
                const card = el('div', 'podium-card r' + (i + 1));
                card.append(el('div', 'podium-rank', e.rang + '.'));
                const info = el('div');
                info.append(el('div', 'podium-name', e.name));
                info.append(el('div', 'podium-meta', e.minuten + ' min · ' + e.einheiten + ' Einheiten'));
                card.append(info);
                box.append(card);
            });
        }

        function renderTable(entries) {
            const body = document.getElementById('board');
            const max = Math.max(1, ...entries.map(e => e.minuten));
            body.innerHTML = '';
            entries.forEach(e => {
                const tr = el('tr', e.rang <= 3 ? 'top' : '');
                tr.append(el('td', 'c-rank', e.rang));
                tr.append(el('td', 'c-name', e.name));

                const tdMin = el('td', 'c-min');
                const row = el('div', 'bar-row');
                const bar = el('div', 'bar');
                const fill = el('i');
                fill.style.width = (e.minuten / max * 100) + '%';
                bar.append(fill);
                row.append(bar, el('span', 'bar-num', e.minuten + ' min'));
                tdMin.append(row);
                tr.append(tdMin);

                tr.append(el('td', 'c-units', e.einheiten));
                body.append(tr);
            });
        }

        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
