<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Übungs-Scoreboard</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8;
            --gold: #fbbf24; --silver: #cbd5e1; --bronze: #d97706; --text: #f8fafc;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            margin: 0; padding: 30px 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin: 0 0 8px; font-size: 2.2rem; text-align: center; }
        .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
        .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        button {
            background: var(--card); color: var(--text); border: 1px solid #334155;
            padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600;
            transition: all 0.2s;
        }
        button.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }
        .podium {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 16px; margin-bottom: 36px; width: 100%; max-width: 650px;
        }
        .podium-item {
            background: var(--card); border-radius: 12px 12px 0 0; padding: 20px 14px;
            text-align: center; flex: 1; border-top: 4px solid;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .p1 { height: 150px; border-color: var(--gold); order: 2; }
        .p2 { height: 120px; border-color: var(--silver); order: 1; }
        .p3 { height: 100px; border-color: var(--bronze); order: 3; }
        .medal { font-size: 1.8rem; margin-bottom: 6px; }
        .p-name { font-weight: bold; font-size: 1.1rem; word-break: break-word; }
        .p-val { color: var(--accent); font-weight: 700; margin-top: 6px; }
        .board {
            width: 100%; max-width: 650px; background: var(--card);
            border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; border-bottom: 1px solid #334155;
        }
        .row:last-child { border-bottom: none; }
        .rank { width: 36px; color: #94a3b8; font-weight: bold; }
        .name { flex: 1; font-weight: 500; }
        .stats { text-align: right; }
        .main-stat { font-weight: 700; color: var(--accent); font-size: 1.1rem; }
        .sub-stat { font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>

    <h1>🎶 Übungs-Highscore</h1>
    <div class="subtitle" id="updated">Lade Daten...</div>

    <div class="controls">
        <button class="active" onclick="setMode('minuten', this)">⏱️ TOTAL Minuten</button>
        <button onclick="setMode('einheiten', this)">🔥 TOTAL Einheiten</button>
    </div>

    <div class="podium" id="podium"></div>
    <div class="board" id="board"></div>

    <script>
        let rawData = [];
        let mode = 'minuten';

        function setMode(newMode, btn) {
            mode = newMode;
            document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        async function loadData() {
            try {
                // Cache-Buster (?t=...), damit GitHub Pages immer die neuste JSON lädt
                const res = await fetch('data.json?t=' + Date.now());
                const json = await res.json();
                rawData = json.entries || [];
                document.getElementById('updated').textContent = 'Letztes Update: ' + json.updated_at;
                render();
            } catch (e) {
                console.error(e);
            }
        }

        function render() {
            const sorted = [...rawData].sort((a, b) => b[mode] - a[mode]);
            const podiumEl = document.getElementById('podium');
            const boardEl = document.getElementById('board');

            // Top 3 Podium
            const top3 = [sorted[0], sorted[1], sorted[2]];
            const classes = ['p1', 'p2', 'p3'];
            const medals = ['🥇', '🥈', '🥉'];

            podiumEl.innerHTML = top3.map((item, i) => {
                if (!item) return '';
                const val = mode === 'minuten' ? `${item.minuten} Min` : `${item.einheiten} Einh.`;
                return `
                    <div class="podium-item ${classes[i]}">
                        <div class="medal">${medals[i]}</div>
                        <div class="p-name">${item.name}</div>
                        <div class="p-val">${val}</div>
                    </div>
                `;
            }).join('');

            // Komplette Liste
            boardEl.innerHTML = sorted.map((item, idx) => {
                const primary = mode === 'minuten' ? `${item.minuten} Min` : `${item.einheiten} Einheiten`;
                const secondary = mode === 'minuten' ? `${item.einheiten} Einheiten` : `${item.minuten} Min`;
                return `
                    <div class="row">
                        <span class="rank">#${idx + 1}</span>
                        <span class="name">${item.name}</span>
                        <div class="stats">
                            <div class="main-stat">${primary}</div>
                            <div class="sub-stat">${secondary}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadData();
        setInterval(loadData, 15000); // Alle 15 Sekunden aktualisieren
    </script>
</body>
</html>
